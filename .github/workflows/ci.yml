name: TrustRAG checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install fastapi uvicorn python-multipart pydantic httpx numpy pypdf python-dotenv pillow pytesseract
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check patch formatting
        run: git diff --check
